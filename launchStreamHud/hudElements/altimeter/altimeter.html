<script>

  const scale = (number, [inMin, inMax], [outMin, outMax]) => {
    return (number - inMin) / (inMax - inMin) * (outMax - outMin) + outMin
  }

  const svgFile = document.querySelector("svg")
  const viewBoxWidth = parseFloat(svgFile.getAttribute("viewBox").split(" ")[2])
  const clientWidth = svgFile.clientWidth
  const XneedleMax = scale(900, [0,clientWidth],[0,viewBoxWidth]) - scale(11.684, [0,clientWidth],[0,viewBoxWidth])
  console.log(viewBoxWidth, clientWidth, XneedleMax)

  const needle = document.getElementById("altiNeedle")
  const disp = document.getElementById("altiText")

  let dispVal = "888888"
  let altitude = 0
  const animate = () => {
    altitude += 1
    if (altitude > 10000) {
      altitude = 0
    }

    needleX = scale(altitude, [0,10000],[0,888])
    dispVal = altitude.toString().padStart(6, " ")
    disp.textContent = `${dispVal}`
    needle.setAttribute("transform", `translate(${needleX})`)
    requestAnimationFrame(animate)
  }
  animate()
