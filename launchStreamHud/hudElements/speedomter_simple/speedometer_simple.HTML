<script>

  const scale = (number, [inMin, inMax], [outMin, outMax]) => {
    return Math.floor((number - inMin) / (inMax - inMin) * (outMax - outMin) + outMin)
  }

  const needle = document.getElementById("needle")
  const disp = document.getElementById("disp")

  let angle = -40
  let dispVal = "8888"
  const animate = (velocity) => {
    angle = scale(velocity, [0,9999],[-40,220]).toString()
    // dispVal = toString(velocity).padStart(4, " ")
    dispVal = velocity.toString().padStart(4, " ")
    disp.textContent = dispVal

    needle.setAttribute("transform", `rotate(${angle}, 200, 200)`)

  }
  // animate()

  const ws = new WebSocket("ws://localhost:3001")

  // ws.onmessage = (event) => {
  //   const msg = event.data.text()
  //   ws.send(event)
  // }
  ws.addEventListener("message", (event) => {
    event.data.text().then((msg) => {
      msg = msg.split(":")
      if (msg[0] == "v") {
        const velocity = parseInt(msg[1])
        animate(velocity)
      }
    })
  })

</script>
